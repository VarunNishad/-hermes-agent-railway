name: Auto-Update Hermes Release

on:
  schedule:
    # Runs daily at 06:00 UTC — hermes releases use date-based tags (vYYYY.M.D)
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest hermes release
        id: latest
        run: |
          TAG=$(curl -sf https://api.github.com/repos/NousResearch/hermes-agent/releases/latest \
            | jq -r .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Get current pinned ref
        id: current
        run: |
          CURRENT=$(grep -oP '(?<=HERMES_REF=)v[\d.]+' Dockerfile)
          echo "tag=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Bump HERMES_REF if outdated
        if: steps.latest.outputs.tag != steps.current.outputs.tag
        run: |
          NEW="${{ steps.latest.outputs.tag }}"
          OLD="${{ steps.current.outputs.tag }}"
          echo "Bumping $OLD → $NEW"
          sed -i "s/ARG HERMES_REF=${OLD}/ARG HERMES_REF=${NEW}/" Dockerfile

      - name: Commit and push
        if: steps.latest.outputs.tag != steps.current.outputs.tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "chore: bump hermes to ${{ steps.latest.outputs.tag }}"
          git push
